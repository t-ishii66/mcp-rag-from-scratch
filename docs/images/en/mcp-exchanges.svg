<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 600"
     width="100%" style="max-width:780px;height:auto" role="img"
     aria-label="The four messages the client and the server exchange. The three that carry an id get a reply; the notification does not.">
  <style>
    .bg    { fill: #ffffff; }
    .ttl   { fill: #1a1a1a; font-size: 19px; font-weight: 600; }
    .sub   { fill: #6b6b6b; font-size: 12px; }
    .actor { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .step  { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
    .mono  { fill: #b3261e; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .monod { fill: #5b6b8c; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .note  { fill: #6b6b6b; font-size: 11px; }
    .none  { fill: #9a9a9a; font-size: 13px; }
    .life  { stroke: #c3ccdb; stroke-width: 1.4; fill: none; }
    .send  { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .recv  { stroke: #5b6b8c; stroke-width: 1.8; stroke-dasharray: 5 3; fill: none; }
    .hs    { fill: #b3261e; }
    .hr    { fill: #5b6b8c; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .ttl   { fill: #e8e8e8; }
      .sub   { fill: #9a9a9a; }
      .actor { fill: #e8e8e8; }
      .step  { fill: #e8e8e8; }
      .mono  { fill: #ff8a80; }
      .monod { fill: #9aaed6; }
      .note  { fill: #9a9a9a; }
      .none  { fill: #6a6a6a; }
      .life  { stroke: #4a5361; fill: none; }
      .send  { stroke: #ff8a80; fill: none; }
      .recv  { stroke: #9aaed6; fill: none; }
      .hs    { fill: #ff8a80; }
      .hr    { fill: #9aaed6; }
    }
  </style>

  <defs>
    <marker id="hs" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="hs" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
    <marker id="hr" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="hr" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="780" height="600"/>

  <text class="ttl" x="24" y="30">Four messages, and the MCP exchange is over</text>
  <text class="sub" x="24" y="52">The lines that actually went over, shortened. Solid is a send, dashed is a reply</text>

  <text class="actor" x="170" y="104" text-anchor="middle">Client</text>
  <text class="actor" x="620" y="104" text-anchor="middle">Server</text>
  <line class="life" x1="170" y1="118" x2="170" y2="570"/>
  <line class="life" x1="620" y1="118" x2="620" y2="570"/>

  <text class="step" x="24" y="150">(1) initialize</text>
  <text class="note" x="24" y="167">open the connection</text>
  <text class="mono" x="180" y="168">{"id":1,"method":"initialize","params":{"protocolVersion":"…"}}</text>
  <line class="send" x1="170" y1="176" x2="614" y2="176" marker-end="url(#hs)"/>
  <text class="monod" x="180" y="202">{"id":1,"result":{"protocolVersion":"2025-06-18",…}}</text>
  <line class="recv" x1="620" y1="210" x2="176" y2="210" marker-end="url(#hr)"/>
  <text class="note" x="628" y="180">the ids match</text>
  <text class="step" x="24" y="266">(2) notification</text>
  <text class="note" x="24" y="283">tell it we are ready</text>
  <text class="mono" x="180" y="284">{"method":"notifications/initialized"}</text>
  <line class="send" x1="170" y1="292" x2="614" y2="292" marker-end="url(#hs)"/>
  <text class="none" x="628" y="296">✕</text>
  <text class="note" x="628" y="314">no id</text>
  <text class="note" x="628" y="329">and no reply</text>
  <text class="step" x="24" y="348">(3) tools/list</text>
  <text class="note" x="24" y="365">ask what tools exist</text>
  <text class="mono" x="180" y="366">{"id":2,"method":"tools/list"}</text>
  <line class="send" x1="170" y1="374" x2="614" y2="374" marker-end="url(#hs)"/>
  <text class="monod" x="180" y="400">{"id":2,"result":{"tools":[{"name":"search",…}]}}</text>
  <line class="recv" x1="620" y1="408" x2="176" y2="408" marker-end="url(#hr)"/>
  <text class="step" x="24" y="464">(4) tools/call</text>
  <text class="note" x="24" y="481">have it run the tool</text>
  <text class="mono" x="180" y="482">{"id":3,"method":"tools/call","params":{"name":"search",…}}</text>
  <line class="send" x1="170" y1="490" x2="614" y2="490" marker-end="url(#hs)"/>
  <text class="monod" x="180" y="516">{"id":3,"result":{"content":[{"type":"text","text":"…"}]}}</text>
  <line class="recv" x1="620" y1="524" x2="176" y2="524" marker-end="url(#hr)"/>
  <text class="note" x="628" y="494">this is where</text>
  <text class="note" x="628" y="509">ChromaDB runs</text>
</svg>
