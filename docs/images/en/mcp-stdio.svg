<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400"
     width="100%" style="max-width:780px;height:auto" role="img"
     aria-label="The client and the server are separate processes and exchange one line of JSON through standard input and output">
  <style>
    .bg    { fill: #ffffff; }
    .ttl   { fill: #1a1a1a; font-size: 19px; font-weight: 600; }
    .sub   { fill: #6b6b6b; font-size: 12px; }
    .lbl   { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .mono  { fill: #2a2a2a; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .monod { fill: #6b6b6b; font-size: 11px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .proc  { fill: #f2f4f8; stroke: #9aa7bf; stroke-width: 1.4; }
    .inner { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1; }
    .send  { stroke: #b3261e; stroke-width: 2; fill: none; }
    .recv  { stroke: #5b6b8c; stroke-width: 2; fill: none; }
    .err   { stroke: #9a9a9a; stroke-width: 1.4; stroke-dasharray: 4 3; fill: none; }
    .sendt { fill: #b3261e; font-size: 12px; font-weight: 600; }
    .recvt { fill: #5b6b8c; font-size: 12px; font-weight: 600; }
    .hs    { fill: #b3261e; }
    .hr    { fill: #5b6b8c; }
    .he    { fill: #9a9a9a; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .ttl   { fill: #e8e8e8; }
      .sub   { fill: #9a9a9a; }
      .lbl   { fill: #e8e8e8; }
      .mono  { fill: #d6d6d6; }
      .monod { fill: #9a9a9a; }
      .proc  { fill: #1e232b; stroke: #9aaed6; }
      .inner { fill: #14161a; stroke: #4a5361; }
      .send  { stroke: #ff8a80; fill: none; }
      .recv  { stroke: #9aaed6; fill: none; }
      .err   { stroke: #6a6a6a; fill: none; }
      .sendt { fill: #ff8a80; }
      .recvt { fill: #9aaed6; }
      .hs    { fill: #ff8a80; }
      .hr    { fill: #9aaed6; }
      .he    { fill: #6a6a6a; }
    }
  </style>

  <defs>
    <marker id="hs" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="hs" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
    <marker id="hr" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="hr" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
    <marker id="he" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="he" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="780" height="400"/>

  <text class="ttl" x="24" y="30">Separate processes, one line at a time over stdio</text>
  <text class="sub" x="24" y="52">The format is JSON-RPC 2.0. One message is one line (schematic)</text>

  <rect class="proc" x="30" y="86" width="230" height="150" rx="6"/>
  <text class="lbl"  x="46" y="112">Client</text>
  <text class="monod" x="46" y="132">steps/02_mcp_raw.py</text>
  <rect class="inner" x="46" y="146" width="198" height="72" rx="4"/>
  <text class="mono" x="58" y="168">proc.stdin.write(...)</text>
  <text class="mono" x="58" y="188">proc.stdout.readline()</text>
  <text class="sub"  x="58" y="208">no ChromaDB here</text>

  <rect class="proc" x="500" y="86" width="250" height="150" rx="6"/>
  <text class="lbl"  x="516" y="112">Server</text>
  <text class="monod" x="516" y="132">src/server/main.py</text>
  <rect class="inner" x="516" y="146" width="218" height="72" rx="4"/>
  <text class="mono" x="528" y="168">search(query, top_k)</text>
  <text class="mono" x="528" y="192">  -&gt; ChromaDB</text>

  <line class="send" x1="266" y1="136" x2="494" y2="136" marker-end="url(#hs)"/>
  <text class="sendt" x="272" y="126">write one line of JSON to stdin</text>
  <text class="mono"  x="272" y="158">{"id":3,"method":"tools/call",...}</text>

  <line class="recv" x1="494" y1="200" x2="266" y2="200" marker-end="url(#hr)"/>
  <text class="recvt" x="272" y="190">read one line of JSON from stdout</text>
  <text class="mono"  x="272" y="218">{"id":3,"result":{ ... }}</text>

  <text class="sub" x="380" y="248" text-anchor="middle">the same id comes back</text>

  <line class="err" x1="625" y1="242" x2="625" y2="292" marker-end="url(#he)"/>
  <rect class="inner" x="516" y="296" width="234" height="46" rx="4"/>
  <text class="sub"  x="530" y="316">logs go to stderr</text>
  <text class="sub"  x="530" y="333">stdout is the channel, not for logs</text>

  <text class="sub" x="24" y="372">The format is JSON-RPC 2.0. A newline ends a message - no length header, no framing.</text>
</svg>
