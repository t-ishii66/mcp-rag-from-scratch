<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418"
     width="100%" style="max-width:780px;height:auto" role="img"
     aria-label="Two containers, app and ollama. Three kinds of storage: /workspace shared with the host, /opt/venv which is a layer of the image, and named volumes managed by Docker">
  <style>
    .bg    { fill: #ffffff; }
    .ttl   { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
    .sub   { fill: #6b6b6b; font-size: 11px; }
    .box   { fill: #f2f4f8; stroke: #9aa7bf; stroke-width: 1.4; }
    .boxu  { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.4; }
    .row   { fill: #ffffff; stroke: #c3ccdb; stroke-width: 1.2; }
    .rowb  { fill: #eef2f8; stroke: #9aa7bf; stroke-width: 1.2; }
    .name  { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .path  { fill: #1a1a1a; font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .note  { fill: #6b6b6b; font-size: 11px; }
    .alab  { fill: #1a1a1a; font-size: 11px; }
    .ln    { stroke: #5b6b8c; stroke-width: 1.8; fill: none; }
    .hd    { fill: #5b6b8c; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .ttl   { fill: #e8e8e8; }
      .sub   { fill: #9a9a9a; }
      .box   { fill: #1e232b; stroke: #9aaed6; }
      .boxu  { fill: #14161a; stroke: #4a5361; }
      .row   { fill: #14161a; stroke: #4a5361; }
      .rowb  { fill: #1e232b; stroke: #9aaed6; }
      .name  { fill: #e8e8e8; }
      .path  { fill: #e8e8e8; }
      .note  { fill: #9a9a9a; }
      .alab  { fill: #e8e8e8; }
      .ln    { stroke: #9aaed6; fill: none; }
      .hd    { fill: #9aaed6; }
    }
  </style>

  <defs>
    <marker id="h" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="hd" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="780" height="418"/>

  <!-- ============ host ============ -->
  <text class="ttl" x="20" y="44">Host (your machine)</text>
  <rect class="box" x="20" y="56" width="220" height="56" rx="5"/>
  <text class="path" x="34" y="80">mcp-rag-from-scratch/</text>
  <text class="sub"  x="34" y="98">source, data/documents, docs</text>

  <!-- ============ Docker's own area ============ -->
  <text class="ttl" x="20" y="186">Docker's own storage</text>
  <rect class="boxu" x="20" y="198" width="220" height="56" rx="5"/>
  <text class="sub" x="34" y="222">Never appears in the</text>
  <text class="sub" x="34" y="240">host's file tree</text>

  <!-- ============ the links ============ -->
  <path class="ln" d="M240,84 L344,84" marker-end="url(#h)"/>
  <text class="alab" x="292" y="76" text-anchor="middle">bind mount</text>

  <path class="ln" d="M240,226 L318,226"/>
  <path class="ln" d="M318,215 L318,371"/>
  <path class="ln" d="M318,215 L344,215" marker-end="url(#h)"/>
  <path class="ln" d="M318,263 L344,263" marker-end="url(#h)"/>

  <!-- ============ container app ============ -->
  <rect class="boxu" x="350" y="26" width="410" height="272" rx="6"/>
  <text class="name" x="368" y="52">Container: app</text>

  <rect class="rowb" x="368" y="66" width="374" height="38" rx="4"/>
  <text class="path" x="382" y="90">/workspace</text>
  <text class="note" x="728" y="90" text-anchor="end">the very same files</text>

  <rect class="row" x="368" y="124" width="374" height="38" rx="4"/>
  <text class="path" x="382" y="148">/opt/venv</text>
  <text class="note" x="728" y="148" text-anchor="end">image layer (1.6GB)</text>

  <rect class="rowb" x="368" y="196" width="374" height="38" rx="4"/>
  <text class="path" x="382" y="220">/opt/chroma_db</text>
  <text class="note" x="728" y="220" text-anchor="end">named volume</text>

  <rect class="rowb" x="368" y="244" width="374" height="38" rx="4"/>
  <text class="path" x="382" y="268">/opt/hf-cache</text>
  <text class="note" x="728" y="268" text-anchor="end">named volume</text>

  <!-- ============ container ollama ============ -->
  <rect class="boxu" x="350" y="312" width="410" height="92" rx="6"/>
  <text class="name" x="368" y="338">Container: ollama</text>

  <rect class="rowb" x="368" y="352" width="374" height="38" rx="4"/>
  <text class="path" x="382" y="376">/root/.ollama</text>
  <text class="note" x="728" y="376" text-anchor="end">named volume</text>

  <path class="ln" d="M318,371 L344,371" marker-end="url(#h)"/>
</svg>
