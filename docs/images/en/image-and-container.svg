<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="system-ui, -apple-system, sans-serif">
  <style>
    :root { color-scheme: light dark; }
    .ink    { fill: #1f2328; }
    .muted  { fill: #59636e; }
    .line   { stroke: #59636e; fill: none; }
    .box    { fill: #ffffff; stroke: #8c959f; }
    .layer  { fill: #dfe3e8; stroke: #8c959f; }
    .shared { fill: #f2f4f6; stroke: #8c959f; stroke-dasharray: 4 3; }
    .write  { fill: #cfe3f5; stroke: #5a8ab5; }
    .arrow  { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .ink   { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .line  { stroke: #9198a1; fill: none; }
      .box   { fill: #16191d; stroke: #6a737d; }
      .layer { fill: #2b3138; stroke: #6a737d; }
      .shared{ fill: #21262d; stroke: #6a737d; }
      .write { fill: #1d3b52; stroke: #6ea8d8; }
      .arrow { fill: #9198a1; }
    }
  </style>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="arrow"/>
    </marker>
  </defs>

  <!-- ============ Dockerfile ============ -->
  <rect class="box" x="16" y="176" width="132" height="96" rx="6"/>
  <text class="ink" x="82" y="212" font-size="15" font-weight="600" text-anchor="middle">Dockerfile</text>
  <text class="muted" x="82" y="236" font-size="12" text-anchor="middle">the recipe for</text>
  <text class="muted" x="82" y="252" font-size="12" text-anchor="middle">building an image</text>

  <path class="line" fill="none" d="M152,236 L214,236" marker-end="url(#a)"/>
  <text class="ink" x="183" y="222" font-size="12.5" text-anchor="middle">docker build</text>

  <!-- ============ image ============ -->
  <rect class="box" x="222" y="140" width="196" height="168" rx="6"/>
  <text class="ink" x="320" y="166" font-size="15" font-weight="600" text-anchor="middle">Image</text>

  <rect class="layer" x="246" y="180" width="148" height="26" rx="3"/>
  <text class="muted" x="320" y="197" font-size="11.5" text-anchor="middle">CMD layer</text>
  <rect class="layer" x="246" y="210" width="148" height="26" rx="3"/>
  <text class="muted" x="320" y="227" font-size="11.5" text-anchor="middle">RUN layer</text>
  <rect class="layer" x="246" y="240" width="148" height="26" rx="3"/>
  <text class="muted" x="320" y="257" font-size="11.5" text-anchor="middle">base OS</text>

  <text class="ink" x="320" y="292" font-size="12.5" text-anchor="middle" font-weight="600">read-only</text>

  <!-- ============ docker run (three of them) ============ -->
  <path class="line" fill="none" d="M422,200 C466,200 470,96 512,96" marker-end="url(#a)"/>
  <path class="line" fill="none" d="M422,224 L512,224" marker-end="url(#a)"/>
  <path class="line" fill="none" d="M422,248 C466,248 470,352 512,352" marker-end="url(#a)"/>
  <text class="ink" x="467" y="210" font-size="12.5" text-anchor="middle">docker run</text>

  <!-- ============ three containers ============ -->
  <g>
    <rect class="box" x="520" y="46" width="344" height="100" rx="6"/>
    <text class="ink" x="540" y="70" font-size="13.5" font-weight="600">Container 1</text>
    <rect class="write" x="540" y="82" width="200" height="22" rx="3"/>
    <text class="ink" x="640" y="97" font-size="11" text-anchor="middle">write layer</text>
    <rect class="shared" x="540" y="110" width="200" height="22" rx="3"/>
    <text class="muted" x="640" y="125" font-size="11" text-anchor="middle">image layers (shared, read-only)</text>
    <text class="muted" x="758" y="104" font-size="11.5">$ touch a.txt</text>
  </g>

  <g>
    <rect class="box" x="520" y="174" width="344" height="100" rx="6"/>
    <text class="ink" x="540" y="198" font-size="13.5" font-weight="600">Container 2</text>
    <rect class="write" x="540" y="210" width="200" height="22" rx="3"/>
    <text class="ink" x="640" y="225" font-size="11" text-anchor="middle">write layer</text>
    <rect class="shared" x="540" y="238" width="200" height="22" rx="3"/>
    <text class="muted" x="640" y="253" font-size="11" text-anchor="middle">image layers (shared, read-only)</text>
    <text class="muted" x="748" y="232" font-size="11.5">a different process</text>
  </g>

  <g>
    <rect class="box" x="520" y="302" width="344" height="100" rx="6"/>
    <text class="ink" x="540" y="326" font-size="13.5" font-weight="600">Container 3</text>
    <rect class="write" x="540" y="338" width="200" height="22" rx="3"/>
    <text class="ink" x="640" y="353" font-size="11" text-anchor="middle">write layer</text>
    <rect class="shared" x="540" y="366" width="200" height="22" rx="3"/>
    <text class="muted" x="640" y="381" font-size="11" text-anchor="middle">image layers (shared, read-only)</text>
    <text class="muted" x="748" y="360" font-size="11.5">any number of them</text>
  </g>

  <!-- ============ footnote ============ -->
  <text class="ink" x="16" y="440" font-size="12.5">
    <tspan font-weight="600">Deleting a container</tspan><tspan class="muted"> removes only its </tspan><tspan font-weight="600">write layer</tspan><tspan class="muted">. The image never changes, however often it is used.</tspan>
  </text>
  <text class="muted" x="16" y="460" font-size="12">
    So "image = program, container = process" is close to the truth.
  </text>
</svg>
