<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330"
     width="100%" style="max-width:780px;height:auto" role="img"
     aria-label="One round trip: app POSTs a prompt to Ollama and the text comes back in response">
  <style>
    .bg    { fill: #ffffff; }
    .ttl   { fill: #1a1a1a; font-size: 13px; font-weight: 600; }
    .box   { fill: #f2f4f8; stroke: #9aa7bf; stroke-width: 1.4; }
    .boxo  { fill: #fbeeed; stroke: #d08c86; stroke-width: 1.4; }
    .key   { fill: #1a1a1a; font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .val   { fill: #6b6b6b; font-size: 11.5px; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .name  { fill: #1a1a1a; font-size: 14px; font-weight: 600; }
    .sub   { fill: #6b6b6b; font-size: 11px; }
    .alab  { fill: #1a1a1a; font-size: 11.5px; font-weight: 600; }
    .to    { stroke: #b3261e; stroke-width: 1.8; fill: none; }
    .ht    { fill: #b3261e; }
    .foot  { fill: #1a1a1a; font-size: 12px; }

    @media (prefers-color-scheme: dark) {
      .bg    { fill: #14161a; }
      .ttl   { fill: #e8e8e8; }
      .box   { fill: #1e232b; stroke: #9aaed6; }
      .boxo  { fill: #2a1d1d; stroke: #ff8a80; }
      .key   { fill: #e8e8e8; }
      .val   { fill: #9a9a9a; }
      .name  { fill: #e8e8e8; }
      .sub   { fill: #9a9a9a; }
      .alab  { fill: #e8e8e8; }
      .to    { stroke: #ff8a80; fill: none; }
      .ht    { fill: #ff8a80; }
      .foot  { fill: #e8e8e8; }
    }
  </style>

  <defs>
    <marker id="t" markerWidth="8" markerHeight="8" refX="6.5" refY="2.8" orient="auto" markerUnits="strokeWidth">
      <path class="ht" d="M0,0 L6.5,2.8 L0,5.6 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="780" height="330"/>

  <text class="ttl" x="20" y="30">curl, from inside the app container</text>
  <text class="ttl" x="520" y="30">Container: ollama</text>

  <!-- sent -->
  <rect class="box" x="20" y="44" width="330" height="104" rx="6"/>
  <text class="key" x="36" y="68">POST /api/generate</text>
  <text class="key" x="36" y="92">model</text><text class="val" x="120" y="92">qwen3:1.7b</text>
  <text class="key" x="36" y="112">prompt</text><text class="val" x="120" y="112">Say hi in three words.</text>
  <text class="key" x="36" y="132">stream</text><text class="val" x="120" y="132">false</text>

  <path class="to" d="M350,96 L514,96" marker-end="url(#t)"/>
  <text class="alab" x="432" y="84" text-anchor="middle">(1) send a string</text>

  <!-- model -->
  <rect class="boxo" x="520" y="44" width="240" height="218" rx="6"/>
  <text class="name" x="538" y="76">qwen3:1.7b</text>
  <text class="sub"  x="538" y="104">read off the disk and</text>
  <text class="sub"  x="538" y="122">held in memory</text>
  <text class="sub"  x="538" y="156">(2) the CPU works out the</text>
  <text class="sub"  x="538" y="174">next token, one at a time</text>
  <text class="sub"  x="538" y="208">this is inference, and it</text>
  <text class="sub"  x="538" y="226">replies when it is done</text>

  <!-- returned -->
  <path class="to" d="M514,214 L350,214" marker-end="url(#t)"/>
  <text class="alab" x="432" y="202" text-anchor="middle">(3) a string comes back</text>

  <rect class="box" x="20" y="166" width="330" height="96" rx="6"/>
  <text class="key" x="36" y="190">response</text><text class="val" x="120" y="190">Hi there!</text>
  <text class="key" x="36" y="210">done</text><text class="val" x="120" y="210">true</text>
  <text class="key" x="36" y="230">eval_count</text><text class="val" x="120" y="230">4</text>
  <text class="sub"  x="36" y="250">tokens generated; back in under a second</text>

  <text class="foot" x="20" y="296">No MCP, no tools, no search. A string goes in, a string comes back. This is an LLM on its own.</text>
</svg>
