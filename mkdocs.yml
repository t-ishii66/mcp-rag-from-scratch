site_name: MCP RAG from scratch
site_url: https://t-ishii66.github.io/mcp-rag-from-scratch/
repo_url: https://github.com/t-ishii66/mcp-rag-from-scratch

# 日本語が正。docs/en は docs/ja からの翻訳で、
# mkdocs-static-i18n が /ja/ と /en/ の2つを並べて書き出す。
plugins:
  - search
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ja
          name: 日本語
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav:
            - What you need and installing Docker: en/01-setup.md
            - Docker primer: en/02-docker-basics.md
            - Setting up a working environment: en/03-environment.md
            - Running ChromaDB: en/04-chromadb.md
            - Building the database and preparing a search function: en/05-chromadb-persist.md
            - Speaking MCP in raw JSON-RPC: en/06-mcp-protocol.md
            - Writing MCP with the SDK: en/07-mcp-sdk.md
            - Setting up Ollama: en/08-ollama-setup.md
            - The relationship between MCP and Ollama: en/09-mcp-and-ollama.md
            - Completing RAG: en/10-rag.md
            - Running the finished version interactively: en/11-interactive-client.md

nav:
  - 必要な環境と Docker の導入: ja/01-setup.md
  - Docker 入門: ja/02-docker-basics.md
  - 動く環境を用意する: ja/03-environment.md
  - ChromaDB を動かす: ja/04-chromadb.md
  - データベースを作り、検索関数を用意する: ja/05-chromadb-persist.md
  - MCP を生の JSON-RPC で話す: ja/06-mcp-protocol.md
  - MCP を SDK で書く: ja/07-mcp-sdk.md
  - Ollama を用意する: ja/08-ollama-setup.md
  - MCP と Ollama の関係: ja/09-mcp-and-ollama.md
  - RAG を完成させる: ja/10-rag.md
  - 完成版を対話で動かす: ja/11-interactive-client.md

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

markdown_extensions:
  # 日本語の見出しをそのままアンカーにする。既定の slugify は非 ASCII を落とすため、
  # 見出し ID が _1, _2 になり、章内リンクが全部壊れる。
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  # GitHub 形式の > [!NOTE] を admonition に変換する。
  # この記法なら github.com と VS Code のプレビューでもそのまま描画される。
  - github-callouts
  - pymdownx.details
  - attr_list
  - def_list
  - tables
