[project]
name = "mcp-rag-server"
version = "0.1.0"
description = "A teaching project: MCP and RAG built from scratch"
readme = "README-jp.md"
requires-python = ">=3.11"
dependencies = [
    # v2 replaced FastMCP with MCPServer. v1 is not compatible.
    "mcp>=2.0.0",
    "chromadb>=0.4.0",
    "ollama>=0.4.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
]

[project.scripts]
rag-index = "server.indexer:main"
rag-client = "client.main:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client", "src/server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
