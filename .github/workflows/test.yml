name: Test with pytest

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Set up Python
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install uv
      - name: Install uv
        run: pip install uv

      # Install dependencies
      - name: Install dependencies
        run: uv sync
      # Run the tests
      - name: Run pytest
        run: uv run pytest
